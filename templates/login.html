<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #1cc88a, #4e73df);
}

.login-container {
    width: 380px;
    padding: 40px 35px;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 15px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    backdrop-filter: blur(10px);
}

.login-container h2 {
    text-align: center;
    margin-bottom: 30px;
    font-weight: 600;
    color: #333;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    font-size: 13px;
    color: #555;
    margin-bottom: 6px;
    display: block;
}

.form-group input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #ddd;
    font-size: 14px;
    transition: 0.3s;
}

.form-group input:focus {
    border-color: #4e73df;
    box-shadow: 0 0 0 3px rgba(78,115,223,0.15);
    outline: none;
}

.btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: #4e73df;
    color: white;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: 0.3s;
}

.btn:hover {
    background: #2e59d9;
}

.links {
    margin-top: 18px;
    text-align: center;
    font-size: 13px;
}

.links a {
    text-decoration: none;
    color: #4e73df;
    font-weight: 500;
}

.links a:hover {
    text-decoration: underline;
}

/* Flash message style */
.flash-message {
    background: #ffe0e0;
    color: #c0392b;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 15px;
    text-align: center;
    font-size: 14px;
}

@media(max-width: 450px){
    .login-container {
        width: 90%;
    }
}
</style>
</head>

<body>

<div class="login-container">

    <h2>Welcome Back 👋</h2>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="flash-message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="/login">

        <div class="form-group">
            <label>Email or Mobile Number</label>
            <input type="text" name="identifier" placeholder="Enter email or mobile number" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Enter password" required>
        </div>

        <button type="submit" class="btn">Login</button>

    </form>

    <div class="links">
        <p><a href="/forgot-password">Forgot Password?</a></p>
        <p>Don't have an account? <a href="/signup">Signup here</a></p>
    </div>

</div>

</body>
</html>
